<body>

<script>
function apply(){
  var h = location.hash.replace('#','');
  document.querySelectorAll('section').forEach(function(s){
    s.style.display = (!h || s.id===h) ? '' : 'none';
  });
}
window.addEventListener('hashchange', apply);
apply();
</script>
