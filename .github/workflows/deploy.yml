name: Deploy to coen.at

# Manual only — never auto-deploys on push. Trigger from the GitHub UI
# (Actions tab -> Deploy to coen.at -> Run workflow) or via `gh workflow run
# deploy.yml`, which works fine from a Claude Code mobile session too, since
# it only needs `gh` auth — no local SSH key required.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build minified assets
        run: bash tools/minify.sh

      - name: Prepare production fonts
        run: |
          mkdir -p fonts
          cp "references/MapExport Design System/fonts/"*.woff2 fonts/
          sed -i 's#references/MapExport%20Design%20System/fonts/#fonts/#g' style.min.css

      - name: Build production index.html
        run: |
          # Engine v2 ships to production since 2026-09-13 (engine-v2.js is in
          # the rsync whitelist below, unminified: its face worker is built
          # from function source at runtime, which a mangler could break).
          # There is no engine toggle in the UI anywhere: the engine is chosen
          # by the ?engine=1|2 URL parameter (script.js engineV2Selected),
          # default v2, so the production index needs no stripping.
          #
          # Every asset URL gets the deployed commit as its ?v= query. The
          # server sends no Cache-Control, so without a changing query a
          # browser may keep an older script.min.js for days and pair it with
          # the new index.html (the 2026-09-14 deploy had exactly such a
          # mismatch: the old script looked up an element the new HTML no
          # longer had, which would have thrown during page init). The
          # hand-maintained ?v= in the repo's index.html is for dev only.
          V="${GITHUB_SHA:0:8}"
          test -n "$V"
          sed -e "s/href=\"style\.css[^\"]*\"/href=\"style.min.css?v=$V\"/" \
              -e "s/src=\"script\.js[^\"]*\"/src=\"script.min.js?v=$V\"/" \
              -e "s/src=\"engine-v2\.js[^\"]*\"/src=\"engine-v2.js?v=$V\"/" \
              -e 's#references/MapExport%20Design%20System/fonts/#fonts/#g' \
              index.html > /tmp/prod-index.html
          grep -c "?v=$V" /tmp/prod-index.html | grep -qx 3
          chmod 644 /tmp/prod-index.html

      - name: Install deploy SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      # This account (mapexport-deploy) is a restricted, non-root user that
      # only owns the files listed below inside DEPLOY_PATH — it can't touch
      # cache/ (sticky bit on the parent dir blocks deleting/renaming other
      # users' entries) or anything outside this one directory. See
      # memory/reference_deploy.md for how it was set up.
      - name: Sync production files (whitelist only)
        run: |
          rsync -avz --delete -e "ssh -p ${{ secrets.DEPLOY_PORT }}" \
            --include='/script.min.js' \
            --include='/engine-v2.js' \
            --include='/style.min.css' \
            --include='/cache.php' \
            --include='/fonts/' --include='/fonts/**' \
            --exclude='*' \
            ./ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}"

      - name: Sync production index.html
        run: |
          rsync -avz -e "ssh -p ${{ secrets.DEPLOY_PORT }}" /tmp/prod-index.html \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}index.html"

      # rsync -a syncs the target directory's own permissions from the local
      # repo root (plain 755) as a side effect of the sync above, silently
      # wiping the sticky bit (1755) that protects cache/ from this account.
      # Re-assert it every run so it can never drift.
      - name: Restore sticky bit on deploy directory
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "chmod 1755 ${{ secrets.DEPLOY_PATH }}"
