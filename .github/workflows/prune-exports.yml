name: Prune exports

# Keep the committed exports/ trail thin: newest SVG per city, nothing older
# than 7 days. Runs daily and on demand, and commits the pruning straight to
# main. This never builds or deploys anything — deploy stays a separate,
# manual-only workflow (deploy.yml, workflow_dispatch).
on:
  schedule:
    - cron: '23 4 * * *' # 04:23 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prune-exports
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prune to newest-per-city, 7-day window
        run: bash tools/prune-exports.sh

      - name: Commit and push if anything changed
        run: |
          if git diff --cached --quiet; then
            echo "nothing to prune"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore: prune exports to newest-per-city trail"
          git push
