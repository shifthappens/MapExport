<?xml version="1.0" encoding="UTF-8"?>
<!--
  Illustrator label reproduction test (see PLAN.md).

  Minimal artboard with the two ways MapExport emits label text:
    1. Street label  -> <textPath> (text on a path), as in script.js:1280
    2. Park label    -> plain <text x y>,            as in script.js:1474-1475

  Open in Adobe Illustrator to reproduce the reported bug:
    - the street name ("OUDE DIJK") imports as ONE point-text object PER LETTER,
      and sits high of the path centre (dominant-baseline ignored);
    - the park name ("Stadspark Oude Dijk") imports as ONE editable text object.
  Inkscape and browsers render BOTH correctly. The difference is Illustrator's
  SVG <textPath> / dominant-baseline import, not the markup.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="900" height="400" viewBox="0 0 900 400">
  <rect width="900" height="400" fill="#ffffff"/>

  <!-- ===== STREET LABEL: exactly how MapExport emits it (textPath) ===== -->
  <!-- a curved street path -->
  <path d="M60,300 C250,150 650,150 840,300" fill="none" stroke="#F4AFA7" stroke-width="26"/>
  <defs>
    <path id="lp0" d="M60,300 C250,150 650,150 840,300"/>
  </defs>
  <text font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="500"
        dominant-baseline="central" letter-spacing="2.7" text-anchor="middle" fill="#2a2a20">
    <textPath xlink:href="#lp0" startOffset="50%">OUDE DIJK</textPath>
  </text>

  <!-- ===== PARK / FEATURE LABEL: how MapExport emits it (plain point text) ===== -->
  <text x="450" y="90" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400"
        text-anchor="middle" dominant-baseline="middle" fill="#3a6a3a">Stadspark Oude Dijk</text>
</svg>
