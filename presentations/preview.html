<figure><img src="preview/slide-01.png" alt="Workshop slide 1" loading="lazy"><figcaption><details><summary>Slide 01 · Speaker notes</summary><pre>Welcome. Today we will turn a city area into an editable SVG, explore its layers, then export our own cities. Suggested flow: 10 minutes introduction, 5 minutes live demo, 20 minutes hands-on and 10 minutes discussion. Timings are adjustable. The map shown is the live Gent export included with this deck
.</pre></details></figcaption></figure>
<figure><img src="preview/slide-02.png" alt="Workshop slide 2" loading="lazy"><figcaption><details><summary>Slide 02 · Speaker notes</summary><pre>Ask for a quick show of hands: who has traced a base map manually? MapExport tackles repetitive groundwork: streets, blocks and street labels. Do not promise a measured time saving. The amount of cleanup depends on the city and the source data.
Sources: live https://coen.at/mapexport/ inspected and exported 13 September 2026; repository README.md, script.js and references/How to draw a good street map.md. Map data © OpenStreetMap contributors (ODbL), https://www.openstreetmap.org/copyright .</pre></details></figcaption></figure>
<figure><img src="preview/slide-03.png" alt="Workshop slide 3" loading="lazy"><figcaption><details><summary>Slide 03 · Speaker notes</summary><pre>Point out water, roads, parks and blocks. SVG is a vector file: it can be scaled and edited in a vector editor. This is a base map, not a complete travel guide. Sample: presentations/assets/ghent-demo.svg.
Sources: live https://coen.at/mapexport/ inspected and exported 13 September 2026; repository README.md, script.js and references/How to draw a good street map.md. Map data © OpenStreetMap contributors (ODbL), https://www.openstreetmap.org/copyright .</pre></details></figcaption></figure>
<figure><img src="preview/slide-04.png" alt="Workshop slide 4" loading="lazy"><figcaption><details><summary>Slide 04 · Speaker notes</summary><pre>OpenStreetMap provides geographical data. MapExport transforms those features into a designed SVG, including computed city blocks and road labels. City blocks are areas between roads, not individual building footprints. Data coverage and quality vary by location.
Sources: live https://coen.at/mapexport/ inspected and exported 13 September 2026; repository README.md, script.js and references/How to draw a good street map.md. Map data © OpenStreetMap contributors (ODbL), https://www.openstreetmap.org/copyright .</pre></details></figcaption></figure>
<figure><img src="preview/slide-05.png" alt="Workshop slide 5" loading="lazy"><figcaption><details><summary>Slide 05 · Speaker notes</summary><pre>Open https://coen.at/mapexport/ . The controls are on the left, the map on the right. Search, pick the matching location and use Draw rectangle. Screenshot captured from the live site, 13 September 2026. Live controls may evolve.
Sources: live https://coen.at/mapexport/ inspected and exported 13 September 2026; repository README.md, script.js and references/How to draw a good street map.md. Map data © OpenStreetMap contributors (ODbL), https://www.openstreetmap.org/copyright .</pre></details></figcaption></figure>
<figure><img src="preview/slide-06.png" alt="Workshop slide 6" loading="lazy"><figcaption><details><summary>Slide 06 · Speaker notes</summary><pre>For the first exercise choose a manageable central neighbourhood, not an entire metropolitan area. In the sample the rectangle is roughly 2.3 × 2.9 km. The live interface shows approximate printed dimensions. Avoid implying that the website has an A3 selector. A larger export has more objects and may take longer.
Sources: live https://coen.at/mapexport/ inspected and exported 13 September 2026; repository README.md, script.js and references/How to draw a good street map.md. Map data © OpenStreetMap contributors (ODbL), https://www.openstreetmap.org/copyright .</pre></details></figcaption></figure>
<figure><img src="preview/slide-07.png" alt="Workshop slide 7" loading="lazy"><figcaption><details><summary>Slide 07 · Speaker notes</summary><pre>Show the layer checkboxes on the live site. Available options include water bodies, waterways, city blocks, parks/green space, roads, railways and transit features. Street-name controls include road categories. Explain that all available detail does not necessarily improve a printed USE-IT map. City blocks do not represent each individual building.
Sources: live https://coen.at/mapexport/ inspected and exported 13 September 2026; repository README.md, script.js and references/How to draw a good street map.md. Map data © OpenStreetMap contributors (ODbL), https://www.openstreetmap.org/copyright .</pre></details></figcaption></figure>
<figure><img src="preview/slide-08.png" alt="Workshop slide 8" loading="lazy"><figcaption><details><summary>Slide 08 · Speaker notes</summary><pre>These are the option labels observed on the live site. Use File &gt; Open, rather than placing the SVG as a linked image in another document. Inspect Layers or Layers and Objects after opening; group/layer presentation differs between editors. Keep the original SVG for recovery.
Sources: live https://coen.at/mapexport/ inspected and exported 13 September 2026; repository README.md, script.js and references/How to draw a good street map.md. Map data © OpenStreetMap contributors (ODbL), https://www.openstreetmap.org/copyright .</pre></details></figcaption></figure>
<figure><img src="preview/slide-09.png" alt="Workshop slide 9" loading="lazy"><figcaption><details><summary>Slide 09 · Speaker notes</summary><pre>This is a simplified layer list, not a screenshot of an editor. The actual Gent SVG has a Background layer and a clipped Map content parent. Expand Map content to find City blocks. Exact grouping can differ by export version and editor. Keep the crop/clipping group intact: ungrouping everything can expose geometry outside the selected area.
Sources: live https://coen.at/mapexport/ inspected and exported 13 September 2026; repository README.md, script.js and references/How to draw a good street map.md. Map data © OpenStreetMap contributors (ODbL), https://www.openstreetmap.org/copyright .</pre></details></figcaption></figure>
<figure><img src="preview/slide-10.png" alt="Workshop slide 10" loading="lazy"><figcaption><details><summary>Slide 10 · Speaker notes</summary><pre>DEMO SCRIPT
Open presentations/assets/ghent-demo.svg in Inkscape. Fit the page to the window (5). Open Layer &gt; Layers and Objects and expand Map content. Find City blocks. Enter that layer and select its child paths, or select one block and use Edit &gt; Select Same &gt; Fill Color. Verify that only the city-block paths are selected: this sample contains 581. Lock unrelated layers first if their objects share the same fill. Click a palette colour or use Object &gt; Fill and Stroke to change Fill (do not Shift-click, which changes Stroke). Water, roads and parks should retain their colours. Undo once to show that all blocks changed together. Save a separate edited SVG.
The preview on the right changes every child path in city_blocks to #F2CA76 and nothing else. It was rendered by Inkscape from the actual export. This slide is a prompt to switch to a live editor, not a recording of UI clicks. Backup: ghent-recoloured.svg.
Inkscape Select Same documentation: https://inkscape.org/en/doc/tutorials/basic/tutorial-basic.pt_BR.html/ .
Sources: live https://coen.at/mapexport/ inspected and exported 13 September 2026; repository README.md, script.js and references/How to draw a good street map.md. Map data © OpenStreetMap contributors (ODbL), https://www.openstreetmap.org/copyright .</pre></details></figcaption></figure>
<figure><img src="preview/slide-11.png" alt="Workshop slide 11" loading="lazy"><figcaption><details><summary>Slide 11 · Speaker notes</summary><pre>Keep this slide on screen throughout the hands-on exercise. Allow about 20 minutes. Participants can work individually or in pairs. Start with a small central area and choose the SVG format for the editor. Use File &gt; Open and keep the original download. Select only the City blocks paths before changing Fill. Keep roads and water unchanged. Hide and restore a layer, then find a street label. Save a separate working copy and note one concrete observation for the discussion. Done early? Compare the map with a place you know well. If an export is delayed, use https://coen.at/ghent.svg (local backup: presentations/assets/ghent-demo.svg). Watch the progress message and try a smaller area next time. If the file looks unexpected, check SVG format, fonts and layer visibility. Useful bug reports include city, area, editor and expected result.

Sources: live https://coen.at/mapexport/ inspected and exported 13 September 2026; repository README.md, script.js and references/How to draw a good street map.md. Map data © OpenStreetMap contributors (ODbL), https://www.openstreetmap.org/copyright .</pre></details></figcaption></figure>
<figure><img src="preview/slide-12.png" alt="Workshop slide 12" loading="lazy"><figcaption><details><summary>Slide 12 · Speaker notes</summary><pre>End here and invite an open discussion. Collect feedback in three columns on a board or shared document: observation, impact and desired change. Capture the city, area and editor for reproducible problems. Ask for concrete examples and let other participants add their experience before prioritising. Distinguish bugs, usability issues and feature wishes. Finish by asking each person for the one improvement that matters most; do not promise delivery dates.
Sources: live https://coen.at/mapexport/ inspected and exported 13 September 2026; repository README.md, script.js and references/How to draw a good street map.md. Map data © OpenStreetMap contributors (ODbL), https://www.openstreetmap.org/copyright .</pre></details></figcaption></figure>
