<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>loading</title>
<style>
  html, body { margin: 0; background: #6b7280; }
  #wrap { width: 100%; }
  #wrap svg { display: block; width: 100%; height: auto; }
  #err { color: #fff; font: 16px monospace; padding: 20px; }
</style>
</head>
<body>
<div id="wrap"><div id="err">loading…</div></div>
<script>
  // Renders an exported SVG inline so the browser's own engine rasterizes it
  // (faithful, unlike qlmanage). Visual check via the preview MCP on :8889:
  //   1. preview_start "MapExport (PHP)"
  //   2. navigate here with ?file=/mapexport/exports/<name>.svg
  //   3. preview_resize AFTER load (this actually resizes the capture window)
  //   4. preview_screenshot  -> high-res full-map overview, readable labels
  const file = new URLSearchParams(location.search).get('file');
  fetch(file)
    .then(r => { if (!r.ok) throw new Error(r.status + ' ' + file); return r.text(); })
    .then(t => {
      document.getElementById('wrap').innerHTML = t;
      const s = document.querySelector('#wrap svg');
      if (!s) throw new Error('no <svg> in ' + file);
      s.removeAttribute('width'); s.removeAttribute('height'); s.setAttribute('width', '100%');
      document.title = 'ready';
    })
    .catch(e => { document.getElementById('err').textContent = 'ERR ' + e.message; document.title = 'error'; });
</script>
</body>
</html>
